# Herda motores e configurações mantidos pelo SearXNG.
use_default_settings: true

general:
  instance_name: SearXNG

search:
  safe_search: 2
  autocomplete: duckduckgo
  autocomplete_min: 3
  default_lang: pt-BR
  languages:
    - pt-BR
  formats:
    - html

server:
  limiter: true
  public_instance: true
  image_proxy: false
  method: POST

ui:
  default_theme: simple
  theme_args:
    simple_style: dark
