services:
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng
    environment:
      SEARXNG_BASE_URL: ${SITE_URL:?Defina SITE_URL no .env}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Execute ./init.sh para gerar a chave}
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_PORT: "8080"
      SEARXNG_VALKEY_URL: valkey://valkey:6379/0
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    depends_on:
      valkey:
        condition: service_healthy

  valkey:
    image: valkey/valkey:alpine
    restart: unless-stopped
    volumes:
      - ./valkey/valkey.conf:/etc/valkey/valkey.conf:ro
      - valkey-data:/data
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  valkey-data:
