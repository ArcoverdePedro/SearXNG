services:
  caddy:
    image: caddy:alpine
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:?Defina SITE_URL no .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - searxng

volumes:
  caddy-data:
  caddy-config:
